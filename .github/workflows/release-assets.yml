name: Release

# On every published release: build, then attach the release assets, then
# publish the package to npm.
#
#   stadiaref.min.js                       the script-tag build
#   stadiaref-wp-v<version>.zip            the WordPress plugin. Its updater
#                                          looks for this name
#   seguru-debug-toolbar-wp-v2.5.1.zip     the bridge for sites still on
#                                          Seguru Debug Toolbar 2.x. Their
#                                          updater only accepts this name
#
# Manual re-run: the workflow_dispatch trigger takes the tag (e.g. v3.0.0),
# for when a run failed and the release already exists.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach assets to (e.g. v3.0.0)"
        required: true

permissions:
  contents: write   # gh release upload
  id-token: write   # npm publish --provenance

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG_NAME" != "$expected" ]; then
            echo "::error::Release tag ($TAG_NAME) does not match package.json version ($expected)."
            exit 1
          fi

      - name: Build
        run: |
          npm run build
          npm run size
          npm run build:wp
          npm run build:wp-bridge

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          version=$(node -p "require('./package.json').version")
          for f in dist/stadiaref.min.js "dist/stadiaref-wp-v${version}.zip" dist/seguru-debug-toolbar-wp-v2.5.1.zip; do
            if [ ! -f "$f" ]; then echo "::error::$f was not built."; ls -la dist/; exit 1; fi
          done
          gh release upload "$TAG_NAME" \
            dist/stadiaref.min.js \
            "dist/stadiaref-wp-v${version}.zip" \
            dist/seguru-debug-toolbar-wp-v2.5.1.zip \
            --clobber

  # Publishes `stadiaref` to npm with provenance. Authenticated with the
  # NPM_TOKEN repository secret. A missing token or a failed publish fails
  # the job, so it can't go unnoticed. npm refuses to publish a version that
  # already exists, so a manual re-run can't publish twice.
  publish-npm:
    needs: build-and-attach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-attach.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::The NPM_TOKEN secret isn't set. Add it under Settings → Secrets and variables → Actions, then re-run this workflow with the tag."
            exit 1
          fi
          # prepublishOnly runs `npm run build` first.
          npm publish --provenance --access public
