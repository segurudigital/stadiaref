name: Release

# Build once without release or npm-publishing authority. Separate downstream
# jobs attach those exact artifacts to GitHub and publish the exact tarball.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach assets to (e.g. v3.1.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG_NAME" != "$expected" ]; then
            echo "::error::Release tag ($TAG_NAME) does not match package.json version ($expected)."
            exit 1
          fi

      - name: Build release files
        run: |
          npm run build
          npm run size
          npm run build:wp
          npm run build:wp-bridge
          npm pack --ignore-scripts

      - name: Check release files
        run: |
          version=$(node -p "require('./package.json').version")
          for file in \
            dist/stadiaref.min.js \
            "dist/stadiaref-wp-v${version}.zip" \
            dist/seguru-debug-toolbar-wp-v2.5.1.zip \
            "stadiaref-${version}.tgz"
          do
            test -f "$file" || { echo "::error::$file was not built."; exit 1; }
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build
          path: |
            dist/stadiaref.min.js
            dist/stadiaref-wp-v*.zip
            dist/seguru-debug-toolbar-wp-v2.5.1.zip
            stadiaref-*.tgz
          if-no-files-found: error
          retention-days: 1

  attach-github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build
          path: release-build

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.build.outputs.tag }}
        run: |
          version="${TAG_NAME#v}"
          gh release upload "$TAG_NAME" \
            release-build/dist/stadiaref.min.js \
            "release-build/dist/stadiaref-wp-v${version}.zip" \
            release-build/dist/seguru-debug-toolbar-wp-v2.5.1.zip \
            --clobber

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.0"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build
          path: release-build

      - name: Publish the prebuilt tarball
        env:
          TAG_NAME: ${{ needs.build.outputs.tag }}
        run: |
          test "$(npm --version)" = "11.19.1"
          version="${TAG_NAME#v}"
          npm publish "release-build/stadiaref-${version}.tgz" \
            --access public \
            --provenance \
            --ignore-scripts
