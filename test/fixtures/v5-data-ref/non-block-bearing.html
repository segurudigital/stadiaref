<!DOCTYPE html>
<!--
  Fixture: non-block-bearing section (no block children)
  All refs are section or element class. No block-type refs present.
  Expected behaviour:
    - Each [data-ref] classified: section or element
    - Show sections only → only home-header and home-hero visible
    - Show sections and blocks → same (no blocks to show/hide)
    - No block group collapse badge (no blocks)
    - Active-ref tree for element ref shows 2-row chain: section + element
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StadiaRef — Non-block-bearing fixture</title>
  <style>
    body { font-family: sans-serif; margin: 0; }
    [data-ref] { position: relative; padding: 20px; }
    .section { border: 2px solid #ddd; margin: 10px; min-height: 120px; }
    .element  { border: 1px dashed #aaa; margin: 8px; display: inline-block; padding: 8px; }
  </style>
</head>
<body>
  <!-- Section refs: 2-segment grammar home-{section} -->
  <section class="section" data-ref="home-header">
    <h1 class="element" data-ref="home-header-heading-01-01-primary">Primary heading</h1>
    <a class="element" data-ref="home-header-cta-01-01-primary">Get started</a>
  </section>

  <section class="section" data-ref="home-hero">
    <h2 class="element" data-ref="home-hero-heading-01-01-hero">Hero headline</h2>
    <p class="element" data-ref="home-hero-text-01-01-body">Hero body copy lorem ipsum.</p>
    <img class="element" data-ref="home-hero-image-01-01-hero" src="" alt="Hero image">
  </section>

  <script>
    // A page written to the Titan grammar. ?hidden starts StadiaRef hidden.
    window.stadiarefConfig = { startHidden: /[?&]hidden\b/.test(location.search), labels: 'full', profile: 'titan' };
  </script>
  <script src="../../../dist/stadiaref.min.js"></script>
</body>
</html>
